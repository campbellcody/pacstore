[package]
name = "pacstore"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
default-run = "pacstore"

[features]
system-helper = ["dep:alpm", "dep:alpm-utils"]

[[bin]]
name = "pacstore-helper"
path = "src/bin/pacstore-helper.rs"
required-features = ["system-helper"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
alpm = { version = "5", optional = true }
alpm-utils = { version = "5", optional = true }
libc = "0.2"
